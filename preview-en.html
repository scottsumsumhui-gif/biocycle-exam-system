<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOCYCLE 員工版 · 中英文切換預覽 (Offline Preview)</title>
<style>
  :root {
    --primary: #1b7a4b; --primary-light: #2e9e63; --primary-dark: #104e30;
    --accent: #e74c3c; --success: #27ae60; --warning: #f39c12;
    --text-light: #6b7d74; --border: #dde7e2; --surface: #f0f4f8;
    --accent-bg: #fdf0ee; --accent-dark: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif; background: #e9efeb; color: #1f2d27; }
  .brand-bar { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; }
  .bb-logo { font-weight: 700; letter-spacing: .5px; }
  .bb-user { font-size: 13px; opacity: .9; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .lang-toggle { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }
  .screen { min-height: calc(100vh - 46px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .center-card { background: #fff; border-radius: 14px; padding: 30px; max-width: 460px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.08); border-top: 5px solid var(--primary); }
  .center-card.wide { max-width: 720px; }
  .logo-box { text-align: center; font-size: 30px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
  h1 { font-size: 24px; color: var(--primary); margin: 0 0 4px; text-align: center; }
  h2 { font-size: 16px; color: var(--text-light); margin: 0 0 22px; text-align: center; font-weight: 500; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: #36463e; margin-bottom: 6px; font-weight: 600; }
  .form-group input { width: 100%; padding: 11px 12px; border: 2px solid var(--border); border-radius: 9px; font-size: 15px; }
  .form-group input:focus { border-color: var(--primary); outline: none; }
  .btn { border: none; border-radius: 9px; padding: 11px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; }
  .btn-primary.btn-block { width: 100%; margin-top: 6px; }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: #36463e; }
  .btn-outline.btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-sm { font-size: 13px; }
  .module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
  .module-card { border: 2px solid var(--border); border-radius: 12px; padding: 18px 14px; cursor: pointer; text-align: center; transition: .15s; background: #fff; }
  .module-card:hover { border-color: var(--primary-light); box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-2px); }
  .module-icon { font-size: 30px; margin-bottom: 8px; }
  .module-title { font-size: 17px; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
  .module-desc { font-size: 12px; color: var(--text-light); }
  .h-center { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  .quote-card { margin: 16px 0; padding: 14px 18px; border-radius: 10px; background: linear-gradient(135deg,#f8faf8 0%,#f0f5f4 100%); border-left: 3px solid var(--primary); font-style: italic; }
  .quote-text { color: var(--primary-dark); font-size: 15px; line-height: 1.6; }
  .home-info { text-align: center; }
  .home-info p { margin: 4px 0; }
  .note-banner { background: var(--accent-bg); color: var(--accent-dark); border: 1px solid #f3c4bd; border-radius: 9px; padding: 10px 13px; font-size: 12.5px; margin-bottom: 16px; line-height: 1.5; text-align: center; }
  .wt-inline { display: flex; gap: 12px; flex-wrap: wrap; }
  .wt-inline > div { flex: 1; min-width: 110px; }
  .wt-inline label { font-size: 13px; font-weight: 600; color: #36463e; }
  .wt-time, .wt-full { width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: 9px; font-size: 15px; margin-top: 4px; }
  .row-gap { margin-top: 14px; }
  .preview-flag { position: fixed; bottom: 14px; right: 14px; background: var(--primary-dark); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
</style>
</head>
<body>

<div class="brand-bar">
  <div class="bb-logo">BIOCYCLE OPERATION SYSTEM</div>
  <div class="topbar-right">
    <div class="bb-user" id="bbUser">技術員平台</div>
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">🌐 EN</button>
  </div>
</div>

<!-- LOGIN -->
<div class="screen" id="loginScreen">
  <div class="center-card">
    <div class="logo-box" id="loginLogo">BIOCYCLE 技術員平台</div>
    <h2 id="loginSub">BIOCYCLE OPERATION SYSTEM</h2>
    <div class="form-group">
      <label id="lblEmp">員工編號 Employee Number</label>
      <input id="empNumber" placeholder="例如: EMP001">
    </div>
    <div class="form-group">
      <label id="lblPw">密碼 Password</label>
      <input type="password" id="empPassword" placeholder="輸入密碼">
    </div>
    <button class="btn btn-primary btn-block" id="btnLogin">登入 Login</button>
    <div id="loginError" class="note-banner" style="display:none"></div>
  </div>
</div>

<!-- HOME -->
<div class="screen" id="homeScreen" style="display:none">
  <div class="center-card wide">
    <div class="home-info" id="homeHeader"></div>
    <div class="module-grid" id="moduleGrid"></div>
    <div class="h-center">
      <button class="btn btn-outline btn-sm" id="btnChPw">修改密碼</button>
      <button class="btn btn-outline btn-sm" onclick="show('loginScreen')" id="btnLogout">登出</button>
    </div>
  </div>
</div>

<!-- WORKTIME (sample) -->
<div class="screen" id="worktimeScreen" style="display:none">
  <div class="center-card wide">
    <h1 id="wtTitle">工時記錄</h1>
    <div class="note-banner" id="wtNote"></div>
    <div class="wt-inline">
      <div><label id="lblIn">上班時間</label><input class="wt-time" placeholder="--:--"></div>
      <div><label id="lblActIn">實際上班</label><input class="wt-time" placeholder="--:--"></div>
      <div><label id="lblOff">下班時間</label><input class="wt-time" placeholder="--:--"></div>
    </div>
    <div class="row-gap">
      <label id="lblTeam" style="font-size:13px;font-weight:600;color:#36463e">今日隊員（2-4 人）</label>
      <div style="margin-top:6px;color:var(--text-light);font-size:13px">ST411 · ST199 · ST273 · ST444</div>
      <button class="btn btn-outline btn-sm" id="btnAddMem" style="margin-top:6px">+ 加隊員</button>
    </div>
    <div class="row-gap"><label id="lblRemark" style="font-size:13px;font-weight:600;color:#36463e">備註（假期 / 備註）</label><input class="wt-full" style="margin-top:4px"></div>
    <div class="row-gap">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0" id="lblJobs">工作單</h3>
        <button class="btn btn-outline btn-sm" id="btnAddJob">新增下一單</button>
      </div>
      <div style="margin-top:8px;padding:12px;border:1px dashed var(--border);border-radius:8px;color:var(--text-light);font-size:13px" id="jobSample">PC · 客戶 ABC · 09:00–11:30</div>
    </div>
    <div class="row-gap" style="display:flex;gap:12px;align-items:center">
      <button class="btn btn-primary" id="btnSave">儲存</button>
    </div>
    <div class="h-center" style="justify-content:flex-start;margin-top:18px">
      <button class="btn btn-outline btn-sm" onclick="show('homeScreen')" id="btnBackHome">返回主板面</button>
    </div>
  </div>
</div>

<div class="preview-flag">OFFLINE 預覽 · 未上線</div>

<script>
// ===== 雙語字典 (介面 chrome；考試題目維持中文) =====
const I18N = {
  zh: {
    bbUser: '技術員平台',
    toggle: '🌐 EN',
    loginLogo: 'BIOCYCLE 技術員平台',
    loginSub: 'BIOCYCLE OPERATION SYSTEM',
    lblEmp: '員工編號 Employee Number',
    lblPw: '密碼 Password',
    btnLogin: '登入 Login',
    btnChPw: '修改密碼',
    btnLogout: '登出',
    hello: name => `你好，${name}！`,
    levelLine: (lv, gp) => `職級: ${lv} | 組別: ${gp}`,
    pickModule: '請選擇要進入的功能：',
    modules: [
      { icon:'📝', title:'在線考試', desc:'每月技術員資格考試' },
      { icon:'📦', title:'物資倉存記錄', desc:'出入倉 / 即時庫存' },
      { icon:'💰', title:'服務銷售佣金', desc:'渠網 / 服務銷售' },
      { icon:'🚐', title:'車輛里數記錄', desc:'出車 / 入油 / 保養 / 維修' },
      { icon:'⏱️', title:'工時記錄', desc:'每日上班 / 下班 / 工作單 / OT' },
      { icon:'💬', title:'意見箱', desc:'匿名發表意見 / 建議' }
    ],
    quote: '🪷 心靜自然涼，煩惱皆自尋。',
    wtTitle: '工時記錄',
    wtNote: '⚠️ 線下預覽：考試題目維持中文，本頁只示範介面英文。',
    lblIn: '上班時間', lblActIn: '實際上班', lblOff: '下班時間',
    lblTeam: '今日隊員（2-4 人）', btnAddMem: '+ 加隊員',
    lblRemark: '備註（假期 / 備註）', lblJobs: '工作單', btnAddJob: '新增下一單',
    btnSave: '儲存', btnBackHome: '返回主板面'
  },
  en: {
    bbUser: 'Technician Portal',
    toggle: '🌐 中文',
    loginLogo: 'BIOCYCLE Technician Portal',
    loginSub: 'BIOCYCLE OPERATION SYSTEM',
    lblEmp: 'Employee Number',
    lblPw: 'Password',
    btnLogin: 'Login',
    btnChPw: 'Change Password',
    btnLogout: 'Logout',
    hello: name => `Hello, ${name}!`,
    levelLine: (lv, gp) => `Level: ${lv} | Group: ${gp}`,
    pickModule: 'Please select a module:',
    modules: [
      { icon:'📝', title:'Online Exam', desc:'Monthly technician qualification exam' },
      { icon:'📦', title:'Material Warehouse', desc:'Stock in/out · live inventory' },
      { icon:'💰', title:'Sales Commission', desc:'Channel / service sales' },
      { icon:'🚐', title:'Vehicle Mileage', desc:'Dispatch / fuel / service / repair' },
      { icon:'⏱️', title:'Worktime Record', desc:'Daily clock-in/out · job sheet · OT' },
      { icon:'💬', title:'Feedback Box', desc:'Anonymous feedback / suggestions' }
    ],
    quote: '🪷 Peace of mind comes from within, not from what we own.',
    wtTitle: 'Worktime Record',
    wtNote: '⚠️ Offline preview: exam questions stay in Chinese. This page only demos the English UI.',
    lblIn: 'Scheduled In', lblActIn: 'Actual In', lblOff: 'Clock Out',
    lblTeam: "Today's Team (2–4 members)", btnAddMem: '+ Add member',
    lblRemark: 'Remarks (leave / notes)', lblJobs: 'Job Sheet', btnAddJob: 'Add next job',
    btnSave: 'Save', btnBackHome: 'Back to Home'
  }
};

let lang = localStorage.getItem('preview_lang') || 'zh';

function $(id){ return document.getElementById(id); }

function render() {
  const T = I18N[lang];
  document.documentElement.lang = (lang === 'zh') ? 'zh' : 'en';
  $('bbUser').textContent = T.bbUser;
  $('langToggle').textContent = T.toggle;
  $('loginLogo').textContent = T.loginLogo;
  $('loginSub').textContent = T.loginSub;
  $('lblEmp').textContent = T.lblEmp;
  $('lblPw').textContent = T.lblPw;
  $('btnLogin').textContent = T.btnLogin;
  $('btnChPw').textContent = T.btnChPw;
  $('btnLogout').textContent = T.btnLogout;
  // home
  $('homeHeader').innerHTML =
    `<h1>${T.hello('ST411')}</h1>` +
    `<p>${T.levelLine('Senior Technician', 'A')}</p>` +
    `<p style="color:var(--text-light)">${T.pickModule}</p>` +
    `<div class="quote-card"><span class="quote-text">${T.quote}</span></div>`;
  // module grid
  $('moduleGrid').innerHTML = T.modules.map((m, i) =>
    `<div class="module-card" onclick="${i===4 ? "show('worktimeScreen')" : "show('homeScreen')"}">` +
    `<div class="module-icon">${m.icon}</div>` +
    `<div class="module-title">${m.title}</div>` +
    `<div class="module-desc">${m.desc}</div></div>`
  ).join('');
  // worktime
  $('wtTitle').textContent = T.wtTitle;
  $('wtNote').textContent = T.wtNote;
  $('lblIn').textContent = T.lblIn;
  $('lblActIn').textContent = T.lblActIn;
  $('lblOff').textContent = T.lblOff;
  $('lblTeam').textContent = T.lblTeam;
  $('btnAddMem').textContent = T.btnAddMem;
  $('lblRemark').textContent = T.lblRemark;
  $('lblJobs').textContent = T.lblJobs;
  $('btnAddJob').textContent = T.btnAddJob;
  $('btnSave').textContent = T.btnSave;
  $('btnBackHome').textContent = T.btnBackHome;
}

function toggleLang() {
  lang = (lang === 'zh') ? 'en' : 'zh';
  localStorage.setItem('preview_lang', lang);
  render();
}

function show(id) {
  ['loginScreen','homeScreen','worktimeScreen'].forEach(s => $(s).style.display = (s===id)?'flex':'none');
}

// 預覽：登入掣直接入主頁
$('btnLogin').onclick = () => show('homeScreen');

render();
show('loginScreen');
</script>
</body>
</html>
