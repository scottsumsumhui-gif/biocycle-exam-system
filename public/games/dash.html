<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>閃身步 · 老頭回避怪</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0e1014; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
  canvas { background: linear-gradient(180deg, #14181f 0%, #0c0e12 100%); display: block; touch-action: none; }
  /* HUD */
  #hud { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px; color: #e8eef6; font-size: 15px; pointer-events: none; z-index: 5; }
  #hud .pill { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); padding: 6px 12px; border-radius: 20px; letter-spacing: .5px; }
  #hud b { color: #ffd27d; font-size: 18px; }
  /* Dash bar */
  #dashbar { position: absolute; left: 18px; bottom: 22px; width: 140px; height: 8px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; z-index: 5; }
  #dashfill { height: 100%; width: 100%; background: linear-gradient(90deg,#5ad1ff,#7affc4); transition: width .05s linear; }
  #dashlabel { position: absolute; left: 18px; bottom: 34px; color: #9fb0c4; font-size: 12px; z-index: 5; }
  /* Overlays */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #eef3fa; z-index: 10; background: rgba(8,10,14,.82); backdrop-filter: blur(3px); }
  .hidden { display: none !important; }
  .title { font-size: 34px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
  .title .accent { color: #ffd27d; }
  .sub { color: #9fb0c4; font-size: 14px; line-height: 1.9; margin-bottom: 22px; max-width: 320px; }
  .sub kbd { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 5px; padding: 1px 7px; font-size: 12px; color: #e8eef6; }
  .btn { margin-top: 6px; background: linear-gradient(90deg,#ffb347,#ffcc33); color: #2a1d00; font-weight: 800; font-size: 18px; padding: 14px 40px; border: none; border-radius: 30px; cursor: pointer; letter-spacing: 1px; box-shadow: 0 6px 22px rgba(255,179,71,.35); }
  .btn:active { transform: translateY(1px); }
  .bigscore { font-size: 64px; font-weight: 900; color: #ffd27d; margin: 6px 0; text-shadow: 0 0 24px rgba(255,210,125,.4); }
  .gtitle { font-size: 28px; color: #ff7a7a; font-weight: 800; margin-bottom: 4px; }
  .restart { margin-top: 18px; background: rgba(255,255,255,.12); color: #eef3fa; border: 1px solid rgba(255,255,255,.2); padding: 12px 34px; border-radius: 30px; font-size: 16px; cursor: pointer; font-weight: 700; }
  /* Touch controls — 固定底欄，實底，同遊戲畫面完全分開 */
  #touch { position: fixed; bottom: 0; left: 0; right: 0; height: 140px; display: none; z-index: 20; background: rgba(8,10,14,.94); border-top: 1px solid rgba(255,255,255,.09); }
  #touch.on { display: block; }
  .tbtn { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: #e8eef6; font-size: 32px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none; }
  #tleft { left: 20px; }
  #tright { left: 128px; }
  #tdash { right: 20px; width: 108px; height: 108px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(122,255,196,.16); border-color: rgba(122,255,196,.45); font-size: 19px; font-weight: 700; }
  .legend { position:absolute; bottom: 4px; right: 12px; color:#56657a; font-size:11px; z-index:5; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="pill">分數 <b id="score">0</b></div>
    <div class="pill">速度 <b id="lvl">1</b></div>
  </div>
  <div id="dashlabel" class="hidden">閃身步</div>
  <div id="dashbar" class="hidden"><div id="dashfill"></div></div>
  <div class="legend hidden" id="legend">← → 移動 · 空白 / Shift 閃身</div>

  <!-- Start -->
  <div class="screen" id="start">
    <div class="title">閃身步 · <span class="accent">老頭回避怪</span></div>
    <div class="sub">
      花鼓燈導師用「閃身步」回避怪物<br>
      <span style="color:#7affc4">（安徽花鼓燈 · 腰一拧 肩一错 手臂一伸）</span><br>
      每成功避開一隻怪 <b style="color:#ffd27d">+1 分</b><br>
      時間越耐，怪物越快越密<br>
      撞到怪就 Game Over<br><br>
      <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 郁<br>
      <kbd>空白</kbd> / <kbd>Shift</kbd> 閃身步（快走 + 殘影）
    </div>
    <button class="btn" id="playBtn">開始玩</button>
  </div>

  <!-- Game Over -->
  <div class="screen hidden" id="over">
    <div class="gtitle">被捉到了！</div>
    <div style="color:#9fb0c4;font-size:14px">最後得分</div>
    <div class="bigscore" id="finalScore">0</div>
    <div id="bestLine" style="color:#7affc4;font-size:13px;margin-bottom:2px"></div>
    <div style="color:#9fb0c4;font-size:12px;margin-bottom:4px" id="statsLine"></div>
    <button class="restart" id="againBtn">再玩一次</button>
  </div>

  <!-- Touch -->
  <div id="touch">
    <div class="tbtn" id="tleft">◀</div>
    <div class="tbtn" id="tright">▶</div>
    <div class="tbtn" id="tdash">閃身</div>
  </div>
</div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 420, H = 720;
function fit(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  // 手機：預留底部控制欄 140px，遊戲畫面只佔上面，唔會被掣擋住
  const touchMode = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
  const barH = touchMode ? 140 : 0;
  const s = Math.min(window.innerWidth/W, (window.innerHeight-barH)/H);
  const ch = Math.floor(H*s);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = Math.floor(W*s) + 'px';
  cv.style.height = ch + 'px';
  cv.style.marginTop = Math.max(0, Math.floor((window.innerHeight-barH-ch)/2)) + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
fit(); window.addEventListener('resize', fit);

// UI
const elScore=document.getElementById('score'), elLvl=document.getElementById('lvl');
const elDash=document.getElementById('dashfill');
const hud=document.getElementById('hud'), dashbar=document.getElementById('dashbar'), dashlabel=document.getElementById('dashlabel'), legend=document.getElementById('legend');
const startScreen=document.getElementById('start'), overScreen=document.getElementById('over');
const finalScore=document.getElementById('finalScore'), bestLine=document.getElementById('bestLine'), statsLine=document.getElementById('statsLine');

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;

// State
let running=false, last=0, score=0, level=1, elapsed=0, spawnT=0, best = +(localStorage.getItem('flashman_best')||0);
let player, monsters, particles;

// Input
const keys={left:false,right:false};
let dashHeld=false;
let dashCool=0; const DASH_CD=0.9;      // seconds
let dashTime=0; const DASH_DUR=0.5;     // active window (配合真人動作速度)
const WALK=170, DASH_SPD=470;

function reset(){
  player={x:W/2, y:H-90, facing:1, afterimg:[], moving:false, phase:0};
  monsters=[]; particles=[];
  score=0; level=1; elapsed=0; spawnT=0; dashCool=0; dashTime=0;
  elScore.textContent='0'; elLvl.textContent='1'; elDash.style.width='100%';
}

function start(){
  initAudio();
  reset(); running=true;
  startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
  hud.classList.remove('hidden'); dashbar.classList.remove('hidden'); dashlabel.classList.remove('hidden'); legend.classList.remove('hidden');
  if(isTouch) document.getElementById('touch').classList.add('on');
  last=performance.now(); requestAnimationFrame(loop);
}

function gameOver(){
  running=false;
  try{ if(window.parent&&window.parent!==window){ window.parent.postMessage({type:"biocycle-game-score",game:"dash",score:score},"*"); } }catch(e){}
  finalScore.textContent=score;
  if(score>best){ best=score; localStorage.setItem('flashman_best',best); bestLine.textContent='★ 新紀錄！'; }
  else bestLine.textContent='最佳：'+best;
  statsLine.textContent='撐咗 '+elapsed.toFixed(1)+' 秒 · 速度等級 '+level;
  overScreen.classList.remove('hidden');
  hud.classList.add('hidden'); dashbar.classList.add('hidden'); dashlabel.classList.add('hidden'); legend.classList.add('hidden');
  document.getElementById('touch').classList.remove('on');
  // burst
  for(let i=0;i<26;i++) particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.6,c:'#ff7a7a'});
}

// Spawning
function spawnMonster(){
  const r=16+Math.random()*14;
  monsters.push({x:30+Math.random()*(W-60), y:-r, r, vx:(Math.random()-.5)*40, hue:Math.random()*360, wob:Math.random()*6.28, passed:false});
}

// Loop
function loop(t){
  if(!running) return;
  let dt=(t-last)/1000; last=t; if(dt>0.05) dt=0.05;
  elapsed+=dt;
  level=1+Math.floor(elapsed/9);                 // speed up every 9s
  const speedMul=1+ (level-1)*0.22;
  const spawnGap=Math.max(0.42, 1.15 - level*0.07);

  // input -> movement
  let dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir!==0) player.facing=dir;
  player.moving = dir!==0;
  player.phase = (player.phase||0) + dt*8;
  dashCool=Math.max(0,dashCool-dt);
  const dashing = dashHeld && dashCool<=0 && dashTime<=0;
  if(dashing){ dashTime=DASH_DUR; dashCool=DASH_CD; playDashVoice(); }
  let spd = dashing?0 : (dashTime>0?DASH_SPD: (dir!==0?WALK:0));
  if(dashTime>0){ dashTime-=dt; spd=DASH_SPD; if(dir===0) spd=DASH_SPD*player.facing? DASH_SPD*player.facing:0; }
  player.x += dir!==0 ? dir*spd*dt : (dashTime>0? player.facing*DASH_SPD*dt : 0);
  player.x=Math.max(22,Math.min(W-22,player.x));

  // afterimage when dashing
  if(dashTime>0){
    player.afterimg.push({x:player.x,y:player.y,life:.3});
    if(player.afterimg.length>16) player.afterimg.shift();
  }
  player.afterimg.forEach(a=>a.life-=dt);
  player.afterimg=player.afterimg.filter(a=>a.life>0);

  // dash bar ui
  elDash.style.width = (dashCool>0 ? (1-dashCool/DASH_CD)*100 : 100) + '%';

  // spawn
  spawnT-=dt;
  if(spawnT<=0){ spawnMonster(); spawnT=spawnGap; }

  // monsters
  for(const m of monsters){
    m.wob+=dt*4;
    m.y += (70*speedMul)*dt;
    m.x += Math.sin(m.wob)*18*dt + m.vx*0.0; // gentle drift
    m.x=Math.max(m.r,Math.min(W-m.r,m.x));
    // collision (player hitbox smaller = old man dodgy)
    const dx=m.x-player.x, dy=m.y-player.y;
    const hit=m.r + 16;
    if(dx*dx+dy*dy < hit*hit){ gameOver(); }
    // passed = dodged
    if(!m.passed && m.y > player.y + 24){
      m.passed=true; score++; elScore.textContent=score;
      for(let i=0;i<6;i++) particles.push({x:m.x,y:m.y,vx:(Math.random()-.5)*120,vy:-Math.random()*120,life:.5,c:'#a9713d'});
    }
  }
  monsters=monsters.filter(m=>m.y < H+40);

  // particles
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // ground line
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,player.y+26); ctx.lineTo(W,player.y+26); ctx.stroke();

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*1.6); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  // monsters（屎屎的 💩）
  for(const m of monsters){
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.sin(m.wob)*0.18);
    ctx.font = Math.round(m.r*2.3)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💩', 0, 2);
    ctx.restore();
  }

  // player afterimages
  for(const a of player.afterimg){
    ctx.globalAlpha=a.life*1.4; drawSprite(a.x,a.y,player.facing,true,'flash',0); ctx.globalAlpha=1;
  }
  const pose = dashTime>0 ? 'flash' : (player.moving ? 'walk' : 'idle');
  drawSprite(player.x,player.y,player.facing,false,pose,player.phase||0);
}

// ---- 閃身步 voice（由你條片 0-0.9s 抽出）----
let actx=null, dashBuf=null;
function initAudio(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    if(!dashBuf && window.DASH_VOICE){
      // 拆走 "data:audio/wav;base64," 個 prefix 先好 decode
      const b64 = window.DASH_VOICE.split(',')[1] || window.DASH_VOICE;
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      actx.decodeAudioData(bytes.buffer, buf=>{ dashBuf=buf; }, ()=>{ dashBuf=null; });
    }
  }catch(e){}
}
function playDashVoice(){
  try{
    if(!actx){ initAudio(); }
    if(!actx||!dashBuf) return;
    if(actx.state==='suspended') actx.resume();
    const src=actx.createBufferSource();
    src.buffer=dashBuf;
    const g=actx.createGain();
    g.gain.value=1.4;                 // 推大少少，手機喇叭細
    src.connect(g); g.connect(actx.destination);
    src.start();
  }catch(e){}
}

function drawSprite(x,y,f,ghost,pose,phase){
  if(!sprReady||!sprImg) return;
  const cw=SM.w, ch=SM.h;
  let fi=SM.idle;
  if(pose==='flash'){
    const prog=Math.max(0,Math.min(1, 1 - dashTime/DASH_DUR));
    fi=Math.round(prog*(SM.count-1));
  }
  const drawH=110, drawW=cw/ch*drawH;
  const bob=(pose==='walk')?Math.sin(phase||0)*3:0;
  const footY=y+30-bob;
  ctx.save();
  ctx.translate(x,footY);
  ctx.scale(f<0?-1:1,1);
  ctx.drawImage(sprImg, fi*cw,0,cw,ch, -drawW/2, -drawH, drawW, drawH);
  ctx.restore();
}

// Controls
window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
  if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ dashHeld=true; e.preventDefault(); }
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
  if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight') dashHeld=false;
});

// Touch
function bind(el,on,off){
  el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
  el.addEventListener('touchcancel',()=>{off();});
  el.addEventListener('mousedown',()=>on());
  el.addEventListener('mouseup',()=>off());
}
bind(document.getElementById('tleft'),()=>keys.left=true,()=>keys.left=false);
bind(document.getElementById('tright'),()=>keys.right=true,()=>keys.right=false);
bind(document.getElementById('tdash'),()=>dashHeld=true,()=>dashHeld=false);

document.getElementById('playBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);

</script>
